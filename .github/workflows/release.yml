name: release

# Publica quando voce cria uma tag de versao:
#   npm version patch && git push --follow-tags
#
# Assim a versao do package.json e a tag ficam sempre casadas, e commit de
# trabalho em progresso nao vira release nem dispara aviso de atualizacao.
on:
  push:
    tags:
      - 'v*'
  # Para reprocessar uma tag existente sem precisar recria-la.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O allowScripts do package.json ja libera o node-pty. Sem esse campo
      # commitado, o npm 11 bloquearia o script de install e o build sairia sem
      # o modulo nativo -- o app instalado abriria sem nenhum terminal.
      - name: Instalar dependencias
        run: npm ci

      # O Electron 43 removeu o postinstall: o binario nao vem no npm ci.
      - name: Baixar o binario do Electron
        run: npx --no-install install-electron

      - name: Conferir que o node-pty tem binario nativo
        shell: bash
        run: |
          ls -la node_modules/node-pty/prebuilds/win32-x64/*.node
          node -e "require('node-pty'); console.log('node-pty OK')"

      # Cria a release ANTES do electron-builder, e isto nao e detalhe.
      #
      # O publisher dele sobe os assets em paralelo, e cada upload chama
      # getOrCreateRelease por conta propria. Sem uma release ja existente para
      # a tag, duas chamadas correm juntas e o GitHub acaba com DUAS releases
      # com o mesmo nome de tag -- os assets se dividem entre elas e a URL
      # /releases/download/<tag>/latest.yml passa a apontar para a que nao tem
      # o latest.yml. Resultado: 404 e auto-atualizacao morta em silencio.
      #
      # Com a release ja criada, todos os uploads a encontram e caem no mesmo
      # lugar.
      - name: Criar a release (se ainda nao existir)
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG ja existe"
          else
            gh release create "$TAG" --title "$TAG" --notes "Instalador para Windows. Baixe o .exe abaixo."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Empacotar e publicar
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assina se os secrets existirem; sem eles o build sai sem assinatura
          # e o Smart App Control bloqueia a instalacao no Windows 11.
          # Ver docs/instalacao-e-assinatura.md.
          #
          # Só serve para certificado em arquivo (.pfx em base64). Certificado
          # em token de hardware nao pode ser usado aqui: exige o token fisico
          # plugado, e nesse caso a assinatura tem de ser feita localmente.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      # Sem esta conferencia, uma release quebrada passa despercebida: o build
      # fica verde e so o usuario descobre, quando a atualizacao nunca chega.
      - name: Conferir que a release serve o latest.yml
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.yml"
          for i in $(seq 1 10); do
            CODE=$(curl -sL -o /tmp/latest.yml -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "latest.yml disponivel:"; cat /tmp/latest.yml; exit 0
            fi
            echo "tentativa $i: http=$CODE"; sleep 15
          done
          echo "ERRO: $URL nao respondeu 200. A auto-atualizacao nao funcionaria."
          gh release view "$TAG" --json assets
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar o instalador como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn

name: release

# Publica quando voce cria uma tag de versao:
#   npm version patch && git push --follow-tags
#
# Assim a versao do package.json e a tag ficam sempre casadas, e commit de
# trabalho em progresso nao vira release nem dispara aviso de atualizacao.
on:
  push:
    tags:
      - 'v*'
  # Para reprocessar uma tag existente sem precisar recria-la.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O allowScripts do package.json ja libera o node-pty. Sem esse campo
      # commitado, o npm 11 bloquearia o script de install e o build sairia sem
      # o modulo nativo -- o app instalado abriria sem nenhum terminal.
      - name: Instalar dependencias
        run: npm ci

      # O Electron 43 removeu o postinstall: o binario nao vem no npm ci.
      #
      # Sao ~100 MB puxados do GitHub a cada build, e este passo nao tinha rede
      # de seguranca nenhuma: um `TypeError: fetch failed` ali derrubou a release
      # inteira antes mesmo de ela ser criada. O cache evita a ida a rede quando
      # a versao do Electron nao mudou, e as tres tentativas cobrem a instabilidade
      # que sobrar.
      - name: Cache do binario do Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Baixar o binario do Electron
        shell: bash
        run: |
          for i in 1 2 3; do
            if npx --no-install install-electron; then exit 0; fi
            echo "tentativa $i falhou; nova tentativa em ${i}0s"
            sleep "${i}0"
          done
          echo "as tres tentativas falharam"
          exit 1

      - name: Conferir que o node-pty tem binario nativo
        shell: bash
        run: |
          ls -la node_modules/node-pty/prebuilds/win32-x64/*.node
          node -e "require('node-pty'); console.log('node-pty OK')"

      # Cria a release ANTES do electron-builder, e isto nao e detalhe.
      #
      # O publisher dele sobe os assets em paralelo, e cada upload chama
      # getOrCreateRelease por conta propria. Sem uma release ja existente para
      # a tag, duas chamadas correm juntas e o GitHub acaba com DUAS releases
      # com o mesmo nome de tag -- os assets se dividem entre elas e a URL
      # /releases/download/<tag>/latest.yml passa a apontar para a que nao tem
      # o latest.yml. Resultado: 404 e auto-atualizacao morta em silencio.
      #
      # Com a release ja criada, todos os uploads a encontram e caem no mesmo
      # lugar.
      - name: Criar a release (se ainda nao existir)
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG ja existe"
          else
            # O texto vem de um ARQUIVO, e nao de um heredoc aqui dentro: o
            # `run: |` e um bloco literal de YAML, entao qualquer linha na
            # coluna 0 -- inclusive o terminador do heredoc -- encerra o bloco
            # e invalida o workflow inteiro. Ele nem chega a rodar.
            gh release create "$TAG" --title "$TAG" --notes-file .github/notas-release.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Empacotar e publicar
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assina se os secrets existirem; sem eles o build sai sem assinatura
          # e o Smart App Control bloqueia a instalacao no Windows 11.
          # Ver docs/instalacao-e-assinatura.md.
          #
          # Só serve para certificado em arquivo (.pfx em base64). Certificado
          # em token de hardware nao pode ser usado aqui: exige o token fisico
          # plugado, e nesse caso a assinatura tem de ser feita localmente.
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      # O pacote que abre com o Smart App Control ligado: o electron.exe
      # ORIGINAL mais o nosso app.asar. Depende do `win-unpacked` que o passo
      # acima deixou em dist/, entao vem depois dele.
      #
      # Sobe pelo `gh` e nao pelo electron-builder: para o publisher dele isto
      # nao e um alvo de build, e um arquivo que montamos por fora.
      - name: Empacotar a versao compativel com o SAC
        run: npm run empacotar:sac

      # Junto do zip vao o app.asar sozinho e o sac.json com o hash dele: e o
      # que permite o app se atualizar baixando 4 MB em vez de 142, sem passar
      # por nenhum instalador. Ver src/main/atualizacao-asar.js.
      - name: Publicar o pacote SAC na release
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" dist/*-sac.zip dist/app.asar dist/sac.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sem esta conferencia, uma release quebrada passa despercebida: o build
      # fica verde e so o usuario descobre, quando a atualizacao nunca chega.
      - name: Conferir que a release serve o latest.yml
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.yml"
          for i in $(seq 1 10); do
            CODE=$(curl -sL -o /tmp/latest.yml -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "latest.yml disponivel:"; cat /tmp/latest.yml; exit 0
            fi
            echo "tentativa $i: http=$CODE"; sleep 15
          done
          echo "ERRO: $URL nao respondeu 200. A auto-atualizacao nao funcionaria."
          gh release view "$TAG" --json assets
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar o instalador como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn

  # O pacote do macOS. Depende do job do Windows por UM motivo: e la que a
  # release e criada, e duas criacoes concorrentes para a mesma tag produzem
  # duas releases (o comentario do passo `gh release create` explica). Aqui so
  # se faz upload para uma release que ja existe.
  macos:
    needs: windows
    # `macos-14` e nao `macos-latest`: o alvo declarado no electron-builder.yml
    # e arm64, e o `latest` ja mudou de arquitetura uma vez. Fixar a versao e o
    # que garante que o runner e Apple Silicon.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Mesmo caso do Windows: o Electron 43 nao traz o binario no `npm ci`. O
      # cache do macOS fica em outro lugar.
      - name: Cache do binario do Electron
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Baixar o binario do Electron
        run: |
          for i in 1 2 3; do
            if npx --no-install install-electron; then exit 0; fi
            echo "tentativa $i falhou; nova tentativa em ${i}0s"
            sleep "${i}0"
          done
          echo "as tres tentativas falharam"
          exit 1

      # O node-pty ja traz prebuild darwin-arm64, entao nada compila aqui --
      # e `scripts/prebuild.js` sai com 0 sem chamar o node-gyp. O que PRECISA
      # ser conferido e o bit de execucao do `spawn-helper`: sem ele o pty nao
      # abre, e o sintoma seria a janela subir com nenhum terminal funcionando.
      - name: Conferir que o node-pty tem binario nativo
        run: |
          ls -la node_modules/node-pty/prebuilds/darwin-arm64/
          test -x node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper \
            || { echo "ERRO: spawn-helper sem bit de execucao"; exit 1; }
          node -e "require('node-pty'); console.log('node-pty OK')"

      # `--publish never` de proposito: o zip final nao e o que o electron-builder
      # produz, e sim um refeito depois da assinatura ad-hoc do passo seguinte.
      - name: Empacotar
        run: npx electron-builder --mac --publish never

      # ISTO NAO E OPCIONAL NO APPLE SILICON. Ao contrario do x64, o macOS arm64
      # RECUSA executavel sem assinatura nenhuma -- nem o botao direito -> Abrir
      # salva, porque aquilo contorna a quarentena, e nao a falta de assinatura.
      # O `identity: null` do electron-builder.yml diz "nao procure certificado",
      # e o resultado seria um .app que nunca abre.
      #
      # A assinatura ad-hoc (`--sign -`) nao precisa de conta Apple e resolve
      # isso; ela nao substitui a notarizacao, entao o Gatekeeper continua
      # pedindo o botao direito na primeira abertura, que e o que o LEIA-ME diz.
      #
      # A verificacao falha o job de proposito: e melhor a release nao sair do
      # que sair com um pacote que ninguem consegue abrir.
      - name: Assinar ad-hoc e conferir
        run: |
          APP=$(ls -d dist/mac*/Orquestrador.app | head -1)
          echo "app: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q 'Signature=adhoc' \
            || { echo "ERRO: o .app nao ficou com assinatura ad-hoc"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"

      # `ditto` e nao `zip`: o formato zip comum perde os symlinks internos do
      # bundle (Contents/MacOS, os Frameworks) e o .app chega quebrado do outro
      # lado. O `--keepParent` mantem o proprio .app como raiz do arquivo.
      - name: Refazer o zip com a assinatura dentro
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          ZIP="dist/Orquestrador-${VERSAO}-mac-arm64.zip"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          ls -la "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # Prova de que o zip sobrevive a ida e volta: extrair e conferir que a
      # assinatura continua la. Um zip que perde a assinatura no caminho e
      # exatamente o defeito que o `ditto` existe para evitar.
      - name: Conferir o zip antes de publicar
        run: |
          rm -rf /tmp/confere && mkdir -p /tmp/confere
          ditto -x -k "$ZIP" /tmp/confere
          codesign --verify --deep --strict /tmp/confere/Orquestrador.app
          test -x /tmp/confere/Orquestrador.app/Contents/MacOS/Orquestrador \
            || { echo "ERRO: executavel sem bit de execucao apos o zip"; exit 1; }
          echo "zip conferido"

      - name: Publicar o pacote do macOS na release
        run: gh release upload "${GITHUB_REF_NAME}" "$ZIP" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar o pacote como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacote-macos
          path: dist/*-mac-arm64.zip
          if-no-files-found: warn
